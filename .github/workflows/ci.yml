name: CI — purelife-web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Static Build, CSP and Topology
    runs-on: ubuntu-latest
    env:
      # Valores públicos de build (o deploy real usa as variáveis do projeto no Cloudflare Pages).
      PUBLIC_SITE_ORIGIN: https://purelifebrasil.org
      PUBLIC_API_URL: https://api.purelifebrasil.org
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build (with CSP generation) and verify
        run: pnpm ci:verify
