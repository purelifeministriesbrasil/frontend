name: CI — purelife-web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Static Build, CSP and Topology
    runs-on: ubuntu-latest
    env:
      # Valores públicos de build; o job deploy usa a chave real do Turnstile.
      PUBLIC_SITE_ORIGIN: https://purelifeministriesbrasil.org
      PUBLIC_API_URL: https://api.purelifeministriesbrasil.org
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      PUBLIC_ENABLE_PIX_GATEWAY: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Verificar versão do pnpm (packageManager)
        run: node scripts/verify-package-manager.mjs --runtime

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build (with CSP generation) and verify
        run: pnpm ci:verify

  deploy:
    name: Deploy to Cloudflare Pages (production)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pages-production
      cancel-in-progress: false
    env:
      PUBLIC_SITE_ORIGIN: https://purelifeministriesbrasil.org
      PUBLIC_API_URL: https://api.purelifeministriesbrasil.org
      # Chave pública do widget (não é segredo): variável do repositório.
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      PUBLIC_ENABLE_PIX_GATEWAY: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Vazia ou chave de teste oficial (1x…, 2x…, 3x…, que sempre aprovam/recusam) não vai para produção.
      - name: Fail if the Turnstile site key is missing or a test key
        run: |
          test -n "$PUBLIC_TURNSTILE_SITE_KEY" || { echo "PUBLIC_TURNSTILE_SITE_KEY ausente"; exit 1; }
          if printf '%s' "$PUBLIC_TURNSTILE_SITE_KEY" | grep -Eq '^[123]x0{20}[A-Z]{2}$'; then
            echo "PUBLIC_TURNSTILE_SITE_KEY é uma chave de teste do Turnstile"; exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Verificar versão do pnpm (packageManager)
        run: node scripts/verify-package-manager.mjs --runtime

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify with production values
        run: pnpm ci:verify

      # Barra a publicação enquanto a Política de Privacidade tiver campos [PREENCHER ...] pendentes.
      # Redundante com ci:verify (que já inclui a trava, fazendo o PR falhar no job verify); mantido
      # explícito para que a publicação nunca dependa só da composição do script.
      - name: Fail if the privacy policy has unfilled placeholders
        run: pnpm verify:policy-placeholders

      # wrangler via npx: o wrangler-action instalaria o pacote no projeto e o pnpm bloqueia o postinstall do workerd.
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e1728ab8a6578c45419c0c6e06901ad9
        run: >-
          npx --yes wrangler@3.114.0 pages deploy dist
          --project-name=purelife-site --branch=main
          --commit-hash=${{ github.sha }} --commit-dirty=true
